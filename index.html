<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitá tu presupuesto - Marketing Digital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width: 600px;">
    <h1 class="mb-2">Solicitá tu presupuesto</h1>
    <p class="text-muted mb-4">
      Ofrecemos soluciones integrales de marketing digital para impulsar tu negocio. Completá el formulario y te enviaremos una propuesta a medida.
    </p>

    <form id="formulario" class="card p-4 shadow-sm">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre y apellido</label>
        <input id="nombre" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" type="email" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="telefono" class="form-label">Teléfono</label>
        <input id="telefono" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="servicio" class="form-label">Servicio de interés</label>
        <select id="servicio" class="form-select" required>
          <option value="" disabled selected>Seleccioná un servicio...</option>
          <option value="Diseño web">Diseño web</option>
          <option value="Gestión de redes sociales">Gestión de redes sociales</option>
          <option value="Publicidad digital">Publicidad digital</option>
          <option value="SEO">SEO</option>
          <option value="Analítica digital">Analítica digital</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="presupuesto" class="form-label">Presupuesto estimado</label>
        <select id="presupuesto" class="form-select" required>
          <option value="" disabled selected>Seleccioná un rango...</option>
          <option value="Menos de $100.000">Menos de $100.000</option>
          <option value="$100.000 a $250.000">$100.000 a $250.000</option>
          <option value="$250.000 a $500.000">$250.000 a $500.000</option>
          <option value="Más de $500.000">Más de $500.000</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="mensaje" class="form-label">Mensaje o detalle del proyecto</label>
        <textarea id="mensaje" class="form-control" rows="3" required></textarea>
      </div>

      <button type="submit" id="boton" class="btn btn-primary w-100">Solicitar presupuesto</button>
      <p id="estado" class="text-center mt-3 mb-0"></p>
    </form>
  </main>

  <script>
    // REEMPLAZAR por la URL del Web App de Apps Script (debe terminar en /exec)
    var URL_BACKEND = "https://script.google.com/macros/s/AKfycbxpx7hQTlTssorOhcS7tC9NO1jZuY_NFr17IbUZTYlRXNwmNDqA_-CLiVfCFhIuvGbZlQ/exec";

    document.getElementById("formulario").addEventListener("submit", function (evento) {
      evento.preventDefault();

      var datos = {
        nombre: document.getElementById("nombre").value,
        email: document.getElementById("email").value,
        telefono: document.getElementById("telefono").value,
        servicio: document.getElementById("servicio").value,
        presupuesto: document.getElementById("presupuesto").value,
        mensaje: document.getElementById("mensaje").value
      };

      var boton = document.getElementById("boton");
      var estado = document.getElementById("estado");

      boton.disabled = true;
      boton.textContent = "Enviando solicitud...";

      fetch(URL_BACKEND, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(datos)
      })
      .then(function (respuesta) {
        return respuesta.json();
      })
      .then(function (resultado) {
        estado.textContent = "¡Solicitud enviada con éxito! Te responderemos a la brevedad.";
        estado.className = "text-center mt-3 mb-0 text-success";
        document.getElementById("formulario").reset();
      })
      .catch(function (error) {
        estado.textContent = "Hubo un error al enviar la solicitud. Intentá de nuevo.";
        estado.className = "text-center mt-3 mb-0 text-danger";
      })
      .finally(function () {
        boton.disabled = false;
        boton.textContent = "Solicitar presupuesto";
      });
    });
  </script>
</body>
</html>
